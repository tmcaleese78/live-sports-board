<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniStatPro — Live Sports & Bet Tracker</title>
<style>
  :root {
    --bg: #0b1120; --surface: #131c31; --surface2: #1b2640; --border: #283552;
    --text: #f1f5f9; --muted: #94a3b8; --hdr: #38bdf8; --shadow: 0 8px 24px rgba(0,0,0,0.35);
    --hit-bg: rgba(22,163,74,0.16); --hit-txt: #4ade80; --hit-bdr: #16a34a;
    --miss-bg: rgba(220,38,38,0.16); --miss-txt: #f87171; --miss-bdr: #dc2626;
  }
  body.light {
    --bg: #f1f5f9; --surface: #ffffff; --surface2: #f8fafc; --border: #cbd5e1;
    --text: #1e293b; --muted: #64748b; --hdr: #1a73e8; --shadow: 0 4px 14px rgba(15,23,42,0.08);
    --hit-bg: #ecfdf5; --hit-txt: #15803d; --hit-bdr: #16a34a;
    --miss-bg: #fef2f2; --miss-txt: #b91c1c; --miss-bdr: #dc2626;
  }
  * { box-sizing: border-box; }
  body { font-family: Calibri, -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px 20px 44px; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: 0.6px; } .brand span { color: var(--hdr); }
  .nav { display: flex; flex-wrap: wrap; gap: 8px; }
  .tab-btn, .pill { background: var(--surface); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 7px 15px; font-weight: 700; font-size: 13px; cursor: pointer; }
  .tab-btn.active, .pill.active { background: var(--hdr); color: #0b1120; border-color: var(--hdr); }
  body.light .tab-btn.active, body.light .pill.active { color: #fff; }
  .live-pill { display: flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  h2 { color: var(--hdr); font-size: 15px; letter-spacing: 0.8px; margin: 22px 0 10px; text-transform: uppercase; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .card { background: var(--surface); border-radius: 14px; border: 2px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
  .card.hit { border-color: var(--hit-bdr); } .card.miss { border-color: var(--miss-bdr); }
  .card-banner { display: grid; grid-template-columns: 1fr 1fr 38px; background: #1e293b; color: #fff; font-weight: 800; font-size: 15px; text-align: center; align-items: center; padding: 9px 0; }
  .card-banner.hit { background: #16a34a; } .card-banner.miss { background: #b91c1c; }
  .card-banner div:first-child { border-right: 1px solid rgba(255,255,255,0.25); }
  .del-btn { background: none; border: none; color: rgba(255,255,255,0.8); font-weight: 800; cursor: pointer; font-size: 15px; }
  .hdr-row, .p-main { display: grid; grid-template-columns: 46px 1.6fr 1fr 0.65fr 0.65fr; align-items: center; text-align: center; }
  .hdr-row { background: var(--surface2); color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; padding: 7px 0; border-top: 1px solid var(--border); }
  .p-wrap { border-top: 1px solid var(--border); }
  .p-wrap.hit { background: var(--hit-bg); color: var(--hit-txt); } .p-wrap.miss { background: var(--miss-bg); color: var(--miss-txt); }
  .p-main { font-weight: 700; font-size: 14px; min-height: 44px; padding: 2px 4px; }
  .logo-cell { height: 100%; display: flex; align-items: center; justify-content: center; padding: 4px; }
  .logo-cell img { width: 26px; height: 26px; object-fit: contain; }
  .prog-track { height: 4px; width: 100%; background: rgba(148,163,184,0.18); }
  .prog-fill { height: 100%; transition: width 0.4s ease; }
  .sum-row { display: grid; grid-template-columns: 1.35fr 1fr; padding: 11px 16px; font-weight: 800; font-size: 16px; border-top: 1px solid var(--border); }
  .sum-row:first-child { border-top: none; background: var(--surface2); }
  .sum-row.paid { background: var(--hit-bg); color: var(--hit-txt); }
  .game-card { display: grid; grid-template-columns: 1.9fr 1fr; background: var(--surface); border-radius: 14px; border: 2px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
  .team-line { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-weight: 700; font-size: 15px; }
  .team-left { display: flex; align-items: center; gap: 9px; } .team-left img { width: 26px; height: 26px; object-fit: contain; }
  .game-st { display: flex; align-items: center; justify-content: center; background: var(--surface2); border-left: 1px solid var(--border); font-weight: 700; font-size: 13px; text-align: center; padding: 8px; }
  .search-box, select, input { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-family: inherit; }
  .tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { background: var(--surface2); color: var(--muted); text-align: left; padding: 10px 12px; font-size: 12px; text-transform: uppercase; }
  td { padding: 9px 12px; border-top: 1px solid var(--border); font-weight: 600; }
  .builder { max-width: 680px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .row-flex { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .btn-primary { background: var(--hdr); color: #0b1120; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 800; font-size: 14px; cursor: pointer; }
  body.light .btn-primary { color: #fff; }
  .leg-chip { display: flex; justify-content: space-between; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">OMNI<span>STAT</span>PRO</div>
  <div class="nav">
    <button class="tab-btn active" data-t="board" onclick="setTab('board')">Live Scoreboard &amp; Stats</button>
    <button class="tab-btn" data-t="cards" onclick="setTab('cards')">My Bet Cards (<span id="card-cnt">0</span>)</button>
    <button class="tab-btn" data-t="build" onclick="setTab('build')">+ Build Bet Card</button>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="live-pill"><span class="dot"></span><span id="sync-time">LIVE</span></div>
    <button class="pill" id="theme-btn" onclick="toggleTheme()">Light</button>
  </div>
</div>

<div id="view-board">
  <div class="row-flex">
    <button class="pill active" data-lg="ALL" onclick="setLg('ALL')">All Sports</button>
    <button class="pill" data-lg="NFL" onclick="setLg('NFL')">NFL</button>
    <button class="pill" data-lg="NBA" onclick="setLg('NBA')">NBA</button>
    <button class="pill" data-lg="CFB" onclick="setLg('CFB')">CFB</button>
  </div>
  <div id="games-area">Loading live games...</div>
  <h2>Live Player Stats</h2>
  <div class="row-flex">
    <button class="pill active" data-plg="NFL" onclick="setPlg('NFL')">NFL Players</button>
    <button class="pill" data-plg="NBA" onclick="setPlg('NBA')">NBA Players</button>
    <input class="search-box" id="p-search" placeholder="Search player or team..." oninput="renderPlayers()">
  </div>
  <div class="tbl-wrap"><table id="p-table"></table></div>
</div>

<div id="view-cards" style="display:none"></div>

<div id="view-build" style="display:none">
  <div class="builder">
    <h2 style="margin-top:0">Create Custom Bet Card (Max 8 Legs)</h2>
    <div class="row-flex">
      <input id="b-cost" type="number" step="0.01" placeholder="Cost ($)" style="width:140px">
      <input id="b-pay" type="number" step="0.01" placeholder="Payout ($)" style="width:160px">
    </div>
    <div class="row-flex">
      <select id="b-type" onchange="syncBuilderOpts()">
        <option value="prop">Player Prop</option>
        <option value="ml">Game Winner (Moneyline)</option>
      </select>
      <select id="b-sport" onchange="syncBuilderOpts()">
        <option value="NFL">NFL</option>
        <option value="NBA">NBA</option>
        <option value="CFB">CFB</option>
      </select>
    </div>
    <div id="prop-inputs" class="row-flex">
      <input id="b-player" list="player-datalist" placeholder="Type player name..." style="flex:1;min-width:190px">
      <datalist id="player-datalist"></datalist>
      <select id="b-stat"></select>
      <input id="b-target" type="number" step="0.5" placeholder="Target (e.g. 50)" style="width:150px">
    </div>
    <div id="ml-inputs" class="row-flex" style="display:none">
      <select id="b-team" style="flex:1;min-width:220px"></select>
    </div>
    <div class="row-flex">
      <button class="pill" onclick="addLeg()">+ Add Leg to Card</button>
      <button class="btn-primary" onclick="saveCard()">Save Card to Tracker</button>
    </div>
    <div id="draft-legs"></div>
  </div>
</div>

<script>
let liveData = {games:{NFL:[],NBA:[],CFB:[]}, players:{NFL:[],NBA:[]}}, curTab = 'board', curLg = 'ALL', curPlg = 'NFL', draftLegs = [];
let userCards = JSON.parse(localStorage.getItem('osp_cards') || '[]');
if (localStorage.getItem('osp_theme') === 'light') { document.body.classList.add('light'); document.getElementById('theme-btn').textContent = 'Dark'; }
function toggleTheme() { const l = document.body.classList.toggle('light'); localStorage.setItem('osp_theme', l?'light':'dark'); document.getElementById('theme-btn').textContent = l?'Dark':'Light'; }
function setTab(t) {
