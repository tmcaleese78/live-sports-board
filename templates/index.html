<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniStatPro — Every Game. Every Stat. Every Wager.</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="apple-touch-icon" href="/static/favicon.png">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
    --bg: #02050c; --surface: rgba(11, 18, 34, 0.86); --surface2: rgba(17, 27, 51, 0.92);
    --border: rgba(56, 189, 248, 0.18); --text: #f8fafc; --muted: #94a3b8;
    --accent: #1d8cf8; --accent-glow: rgba(29,140,248,0.45);
    --shadow: 0 14px 36px rgba(0,0,0,0.72);
    --hit-bg: rgba(22,163,74,0.18); --hit-txt: #4ade80; --hit-bdr: #22c55e;
    --miss-bg: rgba(220,38,38,0.18); --miss-txt: #f87171; --miss-bdr: #ef4444;
  }
  body.light {
    --bg: #e4ecf5; --surface: rgba(255, 255, 255, 0.92); --surface2: rgba(241, 245, 249, 0.95);
    --border: rgba(15, 23, 42, 0.12); --text: #0f172a; --muted: #475569;
    --accent: #0066ff; --accent-glow: rgba(0,102,255,0.22);
    --shadow: 0 8px 24px rgba(15,23,42,0.08);
    --hit-bg: #ecfdf5; --hit-txt: #15803d; --hit-bdr: #16a34a;
    --miss-bg: #fef2f2; --miss-txt: #b91c1c; --miss-bdr: #dc2626;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-variant-numeric: tabular-nums; background: var(--bg); color: var(--text); margin: 0; padding: 0 0 64px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .arena-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .arena-beams { position: absolute; inset: -20%; background: conic-gradient(from 155deg at 22% -5%, transparent 0deg, rgba(29,140,248,0.22) 14deg, transparent 32deg), conic-gradient(from 185deg at 78% -5%, transparent 0deg, rgba(56,189,248,0.18) 14deg, transparent 32deg), radial-gradient(ellipse 70% 45% at 50% 0%, rgba(0,102,255,0.28), transparent 70%); filter: blur(18px); }
  .arena-floor { position: absolute; left: -25%; right: -25%; bottom: -18%; height: 62%; background-image: linear-gradient(rgba(56,189,248,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,0.14) 1px, transparent 1px); background-size: 56px 56px; transform: perspective(460px) rotateX(64deg); mask-image: linear-gradient(to top, rgba(0,0,0,0.85) 10%, transparent 90%); -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.85) 10%, transparent 90%); }
  .arena-orb { position: absolute; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(29,140,248,0.16), transparent 68%); top: 28%; left: -120px; animation: drift 14s ease-in-out infinite alternate; }
  .arena-orb.r { left: auto; right: -120px; top: 48%; background: radial-gradient(circle, rgba(99,102,241,0.15), transparent 68%); animation-delay: -7s; }
  @keyframes drift { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-45px) scale(1.12); } }
  body.light .arena-beams { opacity: 0.35; } body.light .arena-floor { opacity: 0.45; }
  .ticker-wrap { background: linear-gradient(90deg, #040916, #0b1936, #040916); border-bottom: 1px solid rgba(56,189,248,0.28); overflow: hidden; white-space: nowrap; padding: 7px 0; font-size: 12px; font-weight: 700; color: #e2e8f0; }
  body.light .ticker-wrap { background: #0f172a; color: #f8fafc; }
  .ticker-track { display: inline-block; padding-left: 100%; animation: marquee 42s linear infinite; }
  .ticker-track:hover { animation-play-state: paused; }
  .tk-item { display: inline-flex; align-items: center; gap: 6px; margin-right: 34px; }
  .tk-lg { color: #38bdf8; font-weight: 800; } .tk-odds { color: #94a3b8; }
  @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

  .hero-header { background: linear-gradient(180deg, #000000 0%, #060d1c 100%); border-bottom: 1px solid rgba(56,189,248,0.35); box-shadow: 0 6px 30px rgba(0,0,0,0.65); padding: 12px 24px; }
  body.light .hero-header { background: #ffffff; border-bottom: 1px solid var(--border); box-shadow: 0 2px 12px rgba(15,23,42,0.06); }
  .hero-inner { max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
  .logo-box { flex: 1 1 560px; max-width: 780px; }
  .brand-logo { height: 96px; width: 100%; max-width: 780px; object-fit: contain; object-position: left center; display: block; }
  @media (max-width: 640px) { .brand-logo { height: 64px; } }
  .logo-light { display: none; } body.light .logo-dark { display: none; } body.light .logo-light { display: block; }
  .nav-bar { position: sticky; top: 0; z-index: 40; background: rgba(5,9,20,0.82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); padding: 12px 24px; }
  body.light .nav-bar { background: rgba(255,255,255,0.86); }
  .nav { max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .tab-btn, .pill { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 13px; letter-spacing: 0.2px; cursor: pointer; transition: all .18s ease; }
  .tab-btn:hover, .pill:hover { border-color: var(--accent); color: var(--text); transform: translateY(-1px); }
  .tab-btn.active, .pill.active { background: linear-gradient(135deg, #0066ff, #1d8cf8); color: #ffffff; border-color: #60a5fa; box-shadow: 0 4px 16px var(--accent-glow); }
  .live-pill { display: flex; align-items: center; gap: 8px; background: rgba(17,27,51,0.9); border: 1px solid rgba(34,197,94,0.35); padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #e2e8f0; letter-spacing: 0.4px; }
  body.light .live-pill { background: var(--surface2); color: var(--text); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .main-wrap { max-width: 1440px; margin: 0 auto; padding: 8px 24px 0; }
  h2 { font-family: 'Barlow Condensed', sans-serif; color: var(--text); font-size: 20px; letter-spacing: 1.2px; margin: 26px 0 12px; text-transform: uppercase; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  h2::before { content: ""; width: 4px; height: 18px; border-radius: 4px; background: linear-gradient(180deg, #38bdf8, #0066ff); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(365px, 1fr)); gap: 16px; }
  .card, .sb-card { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; transition: transform .18s ease, border-color .18s ease; }
  .card:hover, .sb-card:hover { transform: translateY(-2px); border-color: rgba(56,189,248,0.45); }
  .card.hit { border: 2px solid var(--hit-bdr); } .card.miss { border: 2px solid var(--miss-bdr); } .sb-card.is-live { border: 1.5px solid #22c55e; }

  .card-banner { display: grid; grid-template-columns: 1fr 1fr 40px; background: linear-gradient(90deg, #0b152c, #172e63); color: #fff; font-weight: 800; font-size: 14px; text-align: center; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .card-banner.hit { background: linear-gradient(90deg, #15803d, #16a34a); } .card-banner.miss { background: linear-gradient(90deg, #991b1b, #dc2626); }
  .card-banner div:first-child { border-right: 1px solid rgba(255,255,255,0.2); }
  .del-btn { background: none; border: none; color: rgba(255,255,255,0.8); font-weight: 800; cursor: pointer; font-size: 15px; }
  .hdr-row, .p-main { display: grid; grid-template-columns: 48px 1.6fr 1fr 0.65fr 0.65fr; align-items: center; text-align: center; }
  .hdr-row { background: var(--surface2); color: var(--muted); font-weight: 700; font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; padding: 8px 0; }
  .p-wrap { border-top: 1px solid var(--border); }
  .p-wrap.hit { background: var(--hit-bg); color: var(--hit-txt); } .p-wrap.miss { background: var(--miss-bg); color: var(--miss-txt); }
  .p-main { font-weight: 700; font-size: 13.5px; min-height: 46px; padding: 3px 6px; }
  .logo-cell { height: 100%; display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 8px; }
  .logo-cell img { width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.45)); }
  .prog-track { height: 4px; width: 100%; background: rgba(148,163,184,0.14); }
  .prog-fill { height: 100%; transition: width 0.4s ease; }
  .sum-row { display: grid; grid-template-columns: 1.35fr 1fr; padding: 12px 16px; font-weight: 800; font-size: 15px; border-top: 1px solid var(--border); }
  .sum-row:first-child { border-top: none; background: var(--surface2); }
  .sum-row.paid { background: var(--hit-bg); color: var(--hit-txt); }
  .sb-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 14px; background: var(--surface2); border-bottom: 1px solid var(--border); font-size: 11.5px; font-weight: 700; letter-spacing: 0.4px; color: var(--muted); }
  .sb-badge { display: inline-flex; align-items: center; gap: 6px; } .sb-live-tag { color: #4ade80; font-weight: 800; }
  .sb-team { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 11px 14px; font-weight: 700; font-size: 15px; background: linear-gradient(90deg, rgba(255,255,255,0.03), transparent); }
  .sb-team + .sb-team { border-top: 1px solid var(--border); }
  .sb-left { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .sb-left img { width: 30px; height: 30px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5)); }
  .sb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.45); }
  .sb-rec { font-size: 12px; font-weight: 600; opacity: 0.85; margin-left: 5px; }
  .sb-poss { width: 8px; height: 8px; border-radius: 50%; background: #facc15; box-shadow: 0 0 8px #facc15; flex-shrink: 0; }
  .sb-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .sb-score { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 900; min-width: 30px; text-align: right; color: #ffffff; text-shadow: 0 1px 3px rgba(0,0,0,0.45); }
  .pick-btn { background: rgba(15,23,42,0.55); backdrop-filter: blur(6px); color: #f8fafc; border: 1px solid rgba(255,255,255,0.32); border-radius: 999px; padding: 4px 11px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; cursor: pointer; transition: all .15s; }
  .pick-btn:hover { background: #1d8cf8; border-color: #ffffff; transform: scale(1.04); }
  .sb-foot { display: flex; align-items: center; justify-content: space-between; padding: 7px 14px; background: var(--surface2); border-top: 1px solid var(--border); font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .filter-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; }
  .filter-grp { display: flex; flex-wrap: wrap; gap: 8px; }
  .search-box, select, input { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 9px 13px; font-size: 13.5px; font-family: inherit; outline: none; transition: border-color .15s; }
  .search-box:focus, select:focus, input:focus { border-color: var(--accent); }
  .tbl-wrap { overflow-x: auto; max-height: 72vh; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { position: sticky; top: 0; z-index: 5; background: var(--surface2); color: var(--muted); text-align: left; padding: 11px 13px; font-size: 11.5px; letter-spacing: 0.5px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
  td { padding: 10px 13px; border-top: 1px solid var(--border); font-weight: 600; }
  tr:hover td { background: rgba(29,140,248,0.07); }
  .builder { max-width: 700px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; box-shadow: var(--shadow); }
  .row-flex { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  .btn-primary { background: linear-gradient(135deg, #0066ff, #1d8cf8); color: #ffffff; border: 1px solid #60a5fa; border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: 13.5px; cursor: pointer; box-shadow: 0 4px 16px var(--accent-glow); transition: transform .15s; }
  .btn-primary:hover { transform: translateY(-1px); }
  .leg-chip { display: flex; justify-content: space-between; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 9px 14px; margin-bottom: 8px; font-weight: 700; font-size: 13.5px; }
  .toast { position: fixed; bottom: 22px; right: 22px; background: linear-gradient(135deg, #0066ff, #1d8cf8); color: #fff; font-weight: 700; font-size: 13px; padding: 11px 18px; border-radius: 999px; box-shadow: 0 10px 28px rgba(0,0,0,0.5); display: none; z-index: 99; }
</style>
</head>

<body>
<div class="arena-bg"><div class="arena-beams"></div><div class="arena-floor"></div><div class="arena-orb"></div><div class="arena-orb r"></div></div>
<header class="hero-header">
  <div class="hero-inner">
    <div class="logo-box">
      <img class="brand-logo logo-dark" src="/static/logo-dark.png" alt="OmniStatPro">
      <img class="brand-logo logo-light" src="/static/logo_light.png" alt="OmniStatPro">
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="live-pill"><span class="dot"></span><span id="sync-time">LIVE</span></div>
      <button class="pill" id="theme-btn" onclick="toggleTheme()">Light</button>
    </div>
  </div>
</header>

<div class="nav-bar">
  <div class="nav">
    <button class="tab-btn active" data-t="scoreboard" onclick="setTab('scoreboard')">Live Scoreboard</button>
    <button class="tab-btn" data-t="stats" onclick="setTab('stats')">Live Stats</button>
    <button class="tab-btn" data-t="cards" onclick="setTab('cards')">My Bet Cards (<span id="card-cnt">0</span>)</button>
    <button class="tab-btn" data-t="build" onclick="setTab('build')">+ Build Bet Card (<span id="draft-cnt">0</span>)</button>
  </div>
</div>
<div class="ticker-wrap"><div class="ticker-track" id="live-ticker">Loading live scoreboard ticker...</div></div>
<div class="main-wrap">
  <div id="view-scoreboard">
    <div class="filter-bar">
      <div class="filter-grp">
        <button class="pill active" data-lg="ALL" onclick="setLg('ALL')">All Sports</button>
        <button class="pill" data-lg="NFL" onclick="setLg('NFL')">NFL</button>
        <button class="pill" data-lg="NBA" onclick="setLg('NBA')">NBA</button>
        <button class="pill" data-lg="CFB" onclick="setLg('CFB')">CFB</button>
      </div>
      <div class="filter-grp">
        <button class="pill active" data-st="ALL" onclick="setSt('ALL')">All Games</button>
        <button class="pill" data-st="in" onclick="setSt('in')">Live Now</button>
        <button class="pill" data-st="pre" onclick="setSt('pre')">Upcoming</button>
        <button class="pill" data-st="post" onclick="setSt('post')">Final</button>
      </div>
    </div>
    <div id="games-area">Loading live games...</div>
  </div>

  <div id="view-stats" style="display:none">
    <h2>Live Player Stats</h2>
    <div class="row-flex">
      <button class="pill active" data-plg="NFL" onclick="setPlg('NFL')">NFL Players</button>
      <button class="pill" data-plg="NBA" onclick="setPlg('NBA')">NBA Players</button>
      <select id="p-team-filter" onchange="renderPlayers()"><option value="ALL">All Teams</option></select>
      <input class="search-box" id="p-search" placeholder="Search player name..." oninput="renderPlayers()">
    </div>
    <div class="tbl-wrap"><table id="p-table"></table></div>
  </div>

  <div id="view-cards" style="display:none"></div>

  <div id="view-build" style="display:none;margin-top:16px">
    <div class="builder">
      <h2 style="margin-top:0">Create Custom Bet Card (Max 8 Legs)</h2>
      <div class="row-flex">
        <input id="b-cost" type="number" step="0.01" placeholder="Cost ($)" style="width:140px">
        <input id="b-pay" type="number" step="0.01" placeholder="Payout ($)" style="width:160px">
      </div>
      <div class="row-flex">
        <select id="b-type" onchange="syncBuilderOpts()">
          <option value="prop">Player Prop</option>
          <option value="ml">Game Winner (Moneyline)</option>
          <option value="spread">Point Spread</option>
          <option value="total">Over / Under Total</option>
        </select>
        <select id="b-sport" onchange="syncBuilderOpts()">
          <option value="NFL">NFL</option>
          <option value="NBA">NBA</option>
          <option value="CFB">CFB</option>
        </select>
      </div>
      <div id="prop-inputs" class="row-flex">
        <input id="b-player" list="player-datalist" placeholder="Type player name..." style="flex:1;min-width:190px">
        <datalist id="player-datalist"></datalist>
        <select id="b-stat"></select>
        <input id="b-target" type="number" step="0.5" placeholder="Target (e.g. 50)" style="width:150px">
      </div>
      <div id="ml-inputs" class="row-flex" style="display:none">
        <select id="b-team" style="flex:1;min-width:200px"></select>
        <input id="b-spread" type="number" step="0.5" placeholder="Spread (e.g. -6.5 or +3.5)" style="width:200px;display:none">
      </div>
      <div id="total-inputs" class="row-flex" style="display:none">
        <select id="b-game" style="flex:1;min-width:210px"></select>
        <select id="b-ou"><option value="Over">Over</option><option value="Under">Under</option></select>
        <input id="b-total" type="number" step="0.5" placeholder="Total (e.g. 48.5)" style="width:150px">
      </div>
      <div class="row-flex">
        <button class="pill" onclick="addLeg()">+ Add Leg to Card</button>
        <button class="btn-primary" onclick="saveCard()">Save Card to Tracker</button>
      </div>
      <div id="draft-legs"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
  
<script>
let liveData = {games:{NFL:[],NBA:[],CFB:[]}, players:{NFL:[],NBA:[]}}, curTab = 'scoreboard', curLg = 'ALL', curSt = 'ALL', curPlg = 'NFL', draftLegs = [];
let userCards = JSON.parse(localStorage.getItem('osp_cards') || '[]'), sortCol = '', sortDir = -1;
if (localStorage.getItem('osp_theme') === 'light') { document.body.classList.add('light'); document.getElementById('theme-btn').textContent = 'Dark'; }
function toggleTheme() { const l = document.body.classList.toggle('light'); localStorage.setItem('osp_theme', l?'light':'dark'); document.getElementById('theme-btn').textContent = l?'Dark':'Light'; }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(t._tm); t._tm = setTimeout(() => t.style.display = 'none', 2200); }
function setTab(t) {
  curTab = t;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
  ['scoreboard','stats','cards','build'].forEach(v => { const el = document.getElementById('view-' + v); if (el) el.style.display = (v === t ? 'block' : 'none'); });
  if (t === 'scoreboard') renderGames();
  if (t === 'stats') renderPlayers();
  if (t === 'cards') renderCards();
  if (t === 'build') { syncBuilderOpts(); renderDraft(); }
}
function setLg(lg) { curLg = lg; document.querySelectorAll('[data-lg]').forEach(b => b.classList.toggle('active', b.dataset.lg === lg)); renderGames(); }
function setSt(st) { curSt = st; document.querySelectorAll('[data-st]').forEach(b => b.classList.toggle('active', b.dataset.st === st)); renderGames(); }
function setPlg(lg) { curPlg = lg; document.querySelectorAll('[data-plg]').forEach(b => b.classList.toggle('active', b.dataset.plg === lg)); renderPlayers(); }
const money = v => '$' + ((Number(v)||0).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}));

function quickPickTeam(sport, team) {
  if (draftLegs.length >= 8) return alert('Max 8 legs per card.');
  draftLegs.push({type: 'ml', sport, team, spread: 0});
  document.getElementById('draft-cnt').textContent = draftLegs.length;
  showToast(`Added ${team} (${sport}) to Bet Card (${draftLegs.length}/8)`);
}

function renderGames() {
  const lgs = curLg === 'ALL' ? ['NFL','NBA','CFB'] : [curLg];
  let html = '';
  lgs.forEach(lg => {
    const raw = (liveData.games && liveData.games[lg]) || [];
    const list = curSt === 'ALL' ? raw : raw.filter(g => g.state === curSt);
    if (!list.length) return;
    html += `<h2>${lg} Games (${list.length})</h2><div class="grid">` + list.map(g => {
      const isLive = g.state === 'in', stLabel = isLive ? `<span class="sb-live-tag">● ${g.status}</span>` : g.status;
      const safeAway = String(g.away || '').replace(/'/g, "\\'"), safeHome = String(g.home || '').replace(/'/g, "\\'");
      return `<div class="sb-card ${isLive?'is-live':''}">
        <div class="sb-top"><span class="sb-badge">${stLabel}</span><span>${g.tv || g.league}</span></div>
        <div class="sb-team" style="background:${g.bg0};color:${g.fg0}">
          <div class="sb-left">${g.lg0?`<img src="${g.lg0}">`:''}<span class="sb-name">${g.away}${g.arec?`<span class="sb-rec">(${g.arec})</span>`:''}</span>${g.aposs?'<span class="sb-poss" title="Possession"></span>':''}</div>
          <div class="sb-right"><button class="pick-btn" onclick="quickPickTeam('${lg}','${safeAway}')">+ Pick</button><span class="sb-score">${g.state==='pre'?'—':g.ascore}</span></div>
        </div>
        <div class="sb-team" style="background:${g.bg1};color:${g.fg1}">
          <div class="sb-left">${g.lg1?`<img src="${g.lg1}">`:''}<span class="sb-name">${g.home}${g.hrec?`<span class="sb-rec">(${g.hrec})</span>`:''}</span>${g.hposs?'<span class="sb-poss" title="Possession"></span>':''}</div>
          <div class="sb-right"><button class="pick-btn" onclick="quickPickTeam('${lg}','${safeHome}')">+ Pick</button><span class="sb-score">${g.state==='pre'?'—':g.hscore}</span></div>
        </div>
        ${g.odds ? `<div class="sb-foot"><span>Line</span><span>${g.odds}</span></div>` : ''}
      </div>`;
    }).join('') + `</div>`;
  });
  document.getElementById('games-area').innerHTML = html || '<p style="color:var(--muted)">No games match this filter right now.</p>';
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = -1; }
  renderPlayers();
}

function quickProp(sport, player, stat) {
  setTab('build');
  document.getElementById('b-type').value = 'prop';
  document.getElementById('b-sport').value = sport;
  syncBuilderOpts();
  document.getElementById('b-player').value = player;
  if (stat) document.getElementById('b-stat').value = stat;
  document.getElementById('b-target').focus();
}

function renderPlayers() {
  const all = (liveData.players && liveData.players[curPlg]) || [];
  const tSel = document.getElementById('p-team-filter');
  const prevT = tSel ? (tSel.value || 'ALL') : 'ALL';
  const teams = [...new Set(all.map(p => p.team).filter(Boolean))].sort();
  if (tSel) tSel.innerHTML = `<option value="ALL">All Teams</option>` + teams.map(t => `<option value="${t}" ${t===prevT?'selected':''}>${t}</option>`).join('');
  const q = (document.getElementById('p-search').value || '').toLowerCase();
  const tf = tSel ? tSel.value : 'ALL';
  let list = all.filter(p => (tf === 'ALL' || p.team === tf) && (p.name.toLowerCase().includes(q) || p.team.toLowerCase().includes(q)));
  const cols = curPlg === 'NFL' ? ['PASS YDS','PASS TD','RUSH YDS','RUSH TD','REC','REC YDS','REC TD','SCRIM YDS'] : ['PTS','REB','AST','3PM','STL','BLK','PRA'];
  if (sortCol && cols.includes(sortCol)) list = [...list].sort((a, b) => sortDir * (((b.stats && b.stats[sortCol]) || 0) - ((a.stats && a.stats[sortCol]) || 0)));
  const defStat = curPlg === 'NFL' ? 'PASS YDS' : 'PTS';
  const hdr = `<tr><th>Action</th><th>Player</th><th>Team</th><th>Status</th>` + cols.map(c => `<th style="cursor:pointer" onclick="sortBy('${c}')">${c}${sortCol===c?(sortDir===-1?' ▼':' ▲'):''}</th>`).join('') + `</tr>`;
  const rows = list.slice(0, 120).map(p => {
    const safeP = String(p.name || '').replace(/'/g, "\\'");
    return `<tr><td><button class="pill" style="padding:3px 10px;font-size:11px" onclick="quickProp('${curPlg}','${safeP}','${defStat}')">+ Prop</button></td><td>${p.name}</td><td>${p.team}</td><td>${p.status}</td>` + cols.map(c => `<td>${(p.stats && p.stats[c]) ?? 0}</td>`).join('') + `</tr>`;
  }).join('');
  document.getElementById('p-table').innerHTML = hdr + rows;
}

function evalLeg(leg) {
  const games = (liveData.games && liveData.games[leg.sport]) || [];
  if (leg.type === 'ml' || leg.type === 'spread') {
    const g = games.find(x => x.away === leg.team || x.home === leg.team || x.away_full === leg.team || x.home_full === leg.team);
    const sp = Number(leg.spread) || 0, lbl = leg.type === 'spread' ? `${sp > 0 ? '+' + sp : sp} Spread` : 'Win Game';
    if (!g) return {name: leg.team, stat: lbl, gained: '—', needed: 'Sched', hit: false, miss: false, pct: 0, bg: '#1e293b', logo: ''};
    const isAway = (g.away === leg.team || g.away_full === leg.team);
    const myS = Number(isAway ? g.ascore : g.hscore) || 0, oppS = Number(isAway ? g.hscore : g.ascore) || 0;
    const margin = Math.round(((myS - oppS) + (leg.type === 'spread' ? sp : 0)) * 10) / 10;
    const hit = g.state === 'post' && margin > 0, miss = g.state === 'post' && margin <= 0;
    const needTxt = hit ? 'HIT' : (miss ? 'MISS' : (margin > 0 ? `+${margin}` : String(margin)));
    return {name: leg.team, stat: lbl, gained: g.state==='pre' ? 'Sched' : `${myS}-${oppS}`, needed: needTxt, hit, miss, pct: hit ? 100 : (margin > 0 ? 75 : 25), bg: isAway ? g.bg0 : g.bg1, logo: isAway ? g.lg0 : g.lg1};
  }
  if (leg.type === 'total') {
    const g = games.find(x => `${x.away} @ ${x.home}` === leg.game);
    const line = Number(leg.total) || 0, lbl = `${leg.ou} ${line}`;
    if (!g) return {name: leg.game, stat: lbl, gained: '—', needed: 'Sched', hit: false, miss: false, pct: 0, bg: '#1e293b', logo: ''};
    const comb = (Number(g.ascore) || 0) + (Number(g.hscore) || 0);
    const diff = Math.round((leg.ou === 'Over' ? (comb - line) : (line - comb)) * 10) / 10;
    const hit = (leg.ou === 'Over' && comb > line) || (leg.ou === 'Under' && g.state === 'post' && comb < line);
    const miss = (leg.ou === 'Under' && comb >= line) || (leg.ou === 'Over' && g.state === 'post' && comb <= line);
    const pct = hit ? 100 : (line > 0 ? Math.max(0, Math.min(100, (comb / line) * 100)) : 0);
    return {name: leg.game, stat: lbl, gained: g.state==='pre' ? 'Sched' : String(comb), needed: diff > 0 ? `+${diff}` : String(diff), hit, miss, pct, bg: g.bg1, logo: g.lg1};
  }
  const p = ((liveData.players && liveData.players[leg.sport]) || []).find(x => x.name.toLowerCase() === leg.player.toLowerCase());
  const cur = p && p.stats ? (Number(p.stats[leg.stat]) || 0) : 0, tgt = Number(leg.target) || 0;
  const delta = Math.round((cur - tgt) * 10) / 10, hit = cur >= tgt && tgt > 0, miss = (!hit) && p && p.state === 'post';
  const pct = hit ? 100 : (tgt > 0 ? Math.max(0, Math.min(100, (cur / tgt) * 100)) : 0);
  return {name: leg.player, stat: `${tgt} ${leg.stat}`, gained: String(cur), needed: delta > 0 ? `+${delta}` : String(delta), hit, miss, pct, bg: p ? p.bg : '#1e293b', logo: p ? p.logo : ''};
}

function renderCards() {
  document.getElementById('card-cnt').textContent = userCards.length;
  let totC = 0, liveP = 0, paidP = 0;
  const cardsHtml = userCards.map((c, idx) => {
    const evals = c.legs.map(evalLeg), allHit = evals.length > 0 && evals.every(x => x.hit), anyMiss = evals.some(x => x.miss);
    totC += Number(c.cost) || 0; if (!anyMiss) liveP += Number(c.payout) || 0; if (allHit) paidP += Number(c.payout) || 0;
    const st = allHit ? 'hit' : (anyMiss ? 'miss' : '');
    const rows = evals.map(e => `<div class="p-wrap ${e.hit?'hit':(e.miss?'miss':'')}">
      <div class="p-main"><div class="logo-cell" style="background:${e.bg}">${e.logo?`<img src="${e.logo}">`:''}</div>
      <div>${e.name}</div><div>${e.stat}</div><div>${e.gained}</div><div>${e.needed}</div></div>
      <div class="prog-track"><div class="prog-fill" style="width:${e.pct}%;background:${e.hit?'#22c55e':(e.miss?'#ef4444':e.bg)}"></div></div></div>`).join('');
    return `<div class="card ${st}"><div class="card-banner ${st}"><div>Cost: ${money(c.cost)}</div><div>Payout: ${money(c.payout)}</div><button class="del-btn" onclick="delCard(${idx})">✕</button></div>
      <div class="hdr-row"><div></div><div>Pick</div><div>Target</div><div>Live</div><div>Need</div></div>${rows}</div>`;
  }).join('');
  const sumHtml = `<h2>My Summary</h2><div class="grid"><div class="card ${paidP>0?'hit':''}">
    <div class="sum-row"><div>Total Cost</div><div style="text-align:center">${money(totC)}</div></div>
    <div class="sum-row"><div>Live Potential Payout</div><div style="text-align:center">${money(liveP)}</div></div>
    <div class="sum-row ${paidP>0?'paid':''}"><div>Paid Out</div><div style="text-align:center">${money(paidP)}</div></div></div></div>`;
  document.getElementById('view-cards').innerHTML = sumHtml + `<h2>My Bet Cards</h2>` + (cardsHtml ? `<div class="grid">${cardsHtml}</div>` : `<p style="color:var(--muted)">No cards saved yet. Click <b>+ Build Bet Card</b> or tap <b>+ Pick</b> on any game to create a ticket.</p>`);
}
function delCard(i) { userCards.splice(i, 1); localStorage.setItem('osp_cards', JSON.stringify(userCards)); renderCards(); }

function syncBuilderOpts() {
  const tp = document.getElementById('b-type').value, sp = document.getElementById('b-sport').value;
  document.getElementById('prop-inputs').style.display = tp === 'prop' ? 'flex' : 'none';
  document.getElementById('ml-inputs').style.display = (tp === 'ml' || tp === 'spread') ? 'flex' : 'none';
  document.getElementById('b-spread').style.display = tp === 'spread' ? 'inline-block' : 'none';
  document.getElementById('total-inputs').style.display = tp === 'total' ? 'flex' : 'none';
  if (tp === 'prop') {
    const opts = sp === 'NBA' ? ['PTS','REB','AST','3PM','PRA','PR','PA','RA','STL','BLK'] : ['PASS YDS','RUSH YDS','REC YDS','SCRIM YDS','REC','PASS TD','RUSH TD','REC TD','COMP','CAR'];
    document.getElementById('b-stat').innerHTML = opts.map(o => `<option value="${o}">${o}</option>`).join('');
    document.getElementById('player-datalist').innerHTML = ((liveData.players && liveData.players[sp]) || []).map(p => `<option value="${p.name}">`).join('');
  } else if (tp === 'ml' || tp === 'spread') {
    const teams = []; ((liveData.games && liveData.games[sp]) || []).forEach(g => { teams.push(g.away, g.home); });
    document.getElementById('b-team').innerHTML = teams.map(t => `<option value="${t}">${t}</option>`).join('');
  } else {
    document.getElementById('b-game').innerHTML = ((liveData.games && liveData.games[sp]) || []).map(g => `<option value="${g.away} @ ${g.home}">${g.away} @ ${g.home}</option>`).join('');
  }
}

function addLeg() {
  if (draftLegs.length >= 8) return alert('Max 8 legs per card.');
  const type = document.getElementById('b-type').value, sport = document.getElementById('b-sport').value;
  if (type === 'prop') {
    const player = document.getElementById('b-player').value.trim(), stat = document.getElementById('b-stat').value, target = parseFloat(document.getElementById('b-target').value);
    if (!player || isNaN(target)) return alert('Enter a player name and target number.');
    draftLegs.push({type, sport, player, stat, target});
    document.getElementById('b-player').value = ''; document.getElementById('b-target').value = '';
  } else if (type === 'ml' || type === 'spread') {
    const team = document.getElementById('b-team').value, spread = parseFloat(document.getElementById('b-spread').value);
    if (!team || (type === 'spread' && isNaN(spread))) return alert('Select a team and valid spread.');
    draftLegs.push({type, sport, team, spread: type === 'spread' ? spread : 0});
  } else {
    const game = document.getElementById('b-game').value, ou = document.getElementById('b-ou').value, total = parseFloat(document.getElementById('b-total').value);
    if (!game || isNaN(total)) return alert('Select a game and enter a total.');
    draftLegs.push({type, sport, game, ou, total});
  }
  renderDraft();
}

function renderDraft() {
  document.getElementById('draft-cnt').textContent = draftLegs.length;
  document.getElementById('draft-legs').innerHTML = draftLegs.map((l, i) => {
    const txt = l.type === 'ml' ? `${l.team} (Win)` : l.type === 'spread' ? `${l.team} (${l.spread > 0 ? '+' + l.spread : l.spread})` : l.type === 'total' ? `${l.game} (${l.ou} ${l.total})` : `${l.player} — ${l.target} ${l.stat}`;
    return `<div class="leg-chip"><span>${l.sport}: ${txt}</span><button class="pill" onclick="draftLegs.splice(${i},1);renderDraft()">Remove</button></div>`;
  }).join('');
}

function saveCard() {
  if (!draftLegs.length) return alert('Add at least 1 leg first.');
  const cost = parseFloat(document.getElementById('b-cost').value) || 0, payout = parseFloat(document.getElementById('b-pay').value) || 0;
  userCards.push({cost, payout, legs: draftLegs});
  localStorage.setItem('osp_cards', JSON.stringify(userCards));
  draftLegs = []; renderDraft();
  document.getElementById('b-cost').value = ''; document.getElementById('b-pay').value = '';
  setTab('cards');
}

async function refresh() {
  try {
    const res = await fetch('/api/live?t=' + Date.now());
    if (!res.ok) throw new Error('Feed returned HTTP ' + res.status);
    liveData = await res.json();
    const tk = document.getElementById('live-ticker');
    if (tk && liveData.games) {
      const allG = [...(liveData.games.NFL||[]), ...(liveData.games.NBA||[]), ...(liveData.games.CFB||[])];
      tk.innerHTML = allG.slice(0, 24).map(g => `<span class="tk-item"><span class="tk-lg">${g.league}</span> ${g.away} ${g.state==='pre'?'':g.ascore} @ ${g.home} ${g.state==='pre'?'':g.hscore} <span class="tk-odds">(${g.status}${g.odds?' • '+g.odds:''})</span></span>`).join('') || 'OmniStatPro Live Game Center';
    }
    document.getElementById('card-cnt').textContent = userCards.length;
    if (curTab === 'scoreboard') renderGames();
    if (curTab === 'stats') renderPlayers();
    if (curTab === 'cards') renderCards();
    document.getElementById('sync-time').textContent = 'LIVE • ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  } catch (e) {
    document.getElementById('games-area').innerHTML = `<p style="color:#f87171">Sync issue: ${e.message}</p>`;
  }
}

refresh(); setInterval(refresh, 15000);
</script>
